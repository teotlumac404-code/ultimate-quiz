name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'quizzes.json'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: pip3 install --user buildozer cython==0.29.36
      - name: Add user scripts to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build debug APK
        run: buildozer android debug
      - name: Rename APK
        run: |
          APK=$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" ULTIMATE-QUIZ-Android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTIMATE-QUIZ-Android
          path: ULTIMATE-QUIZ-Android.apk
